<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="numberings.css">
    <script src="animations.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Source Sans Pro', sans-serif;
            color: #333;
            background-color: #f5f5f7;
        }
        .slide {
            min-width: 1280px;
            min-height: 720px;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 40px 70px 20px;
            background-color: #1a237e;
            color: white;
        }
        .title {
            font-size: 40px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .content {
            flex-grow: 1;
            padding: 40px 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .agenda-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 30px;
            margin-top: 20px;
        }
        .agenda-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background-color: #f5f7fa;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .agenda-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .agenda-number {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            background-color: #3949ab;
            color: white;
            border-radius: 90%;
            font-weight: 600;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .agenda-text {
            font-size: 38px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="slide" style="position: relative; width: 100%; height: 100vh;" slide="1">
        <div class="header">
            <h1 class="title">Presentation Outline</h1>
        </div>
        <div class="content">
            <div class="agenda-grid">
                <div class="agenda-item"  >
                    <div class="agenda-number">1</div>
                    <div class="agenda-text">Motivation & Problem statement</div>
                </div>
                <div class="agenda-item " >
                    <div class="agenda-number">2</div>
                    <div class="agenda-text">Existing approaches</div>
                </div>
                <div class="agenda-item " >
                    <div class="agenda-number">3</div>
                    <div class="agenda-text">Proposed Framework</div>
                </div>
                <div class="agenda-item ">
                    <div class="agenda-number">4</div>
                    <div class="agenda-text">Implementation & Evaluation</div>
                </div>
                <div class="agenda-item " >
                    <div class="agenda-number">5</div>
                    <div class="agenda-text">Conclusions & Future Work</div>
                </div>
            </div>
        </div>
        <div class="slide-number">  </div>
  </div>
</body>
</html>
